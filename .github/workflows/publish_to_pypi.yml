name: Build, test, and publish to PyPI

on:
  push:
    branches:
      - main
      - master
    tags:
      - '*'
  pull_request:
    types: [opened, edited, ready_for_review, synchronize]
    paths-ignore:
      - 'docs/**'
      - 'benchmark/**'
      - 'mkdocs.yml'
      - 'README.md'
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      lto:
        description: 'Build wheels with fat LTO, as for a release'
        type: boolean
        default: false
  # Weekly fat-LTO build, so a broken release build shows up before a tag.
  schedule:
    - cron: '0 3 * * 1'


concurrency:

  group: ${{ github.workflow }}-${{ github.ref }}

  cancel-in-progress: true

permissions:
  contents: read

# Windows wheel CPU target; Linux and macOS use per-target matrix settings.
# PYPI_FILE_LIMIT_MIB is polars-bio's PyPI per-file upload limit, checked by
# .github/scripts/check_wheel_size.py. Warehouse's default is 100 MiB; raise it
# only after PyPI grants the project a higher limit.
env:
  TARGET_CPU: skylake
  # Fat LTO (profile `dist`: -30% wheel size, 5-14% faster scans, #511) is
  # slow to build and its aarch64 link needs ~34 GiB, so it runs only for
  # tags (PyPI releases), the weekly schedule, or a manual run with lto=true.
  # Everything else builds the stripped `release` profile.
  BUILD_PROFILE: ${{ (startsWith(github.ref, 'refs/tags/') || github.event_name == 'schedule' || inputs.lto == true) && '--profile dist' || '--release' }}
  PYPI_FILE_LIMIT_MIB: "100"
  SIZE_MARGIN_MIB: "5"

jobs:
  rust_tests:
    runs-on: ubuntu-latest
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Set up Rust
        run: rustup show
      - uses: mozilla-actions/sccache-action@v0.0.9
      - name: Install system dependencies for Rust test build
        run: sudo apt-get update && sudo apt-get install -y libbz2-dev liblzma-dev libcurl4-openssl-dev zlib1g-dev libdeflate-dev
      - name: Run Rust unit tests
        run: cargo test --lib

  linux_tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64]
        python-version: [ "3.11", "3.12", "3.13", "3.14" ]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Set up Rust
        run: rustup show
      - uses: mozilla-actions/sccache-action@v0.0.9
      - name: Install system dependencies for pysam build
        run: sudo apt-get update && sudo apt-get install -y libbz2-dev liblzma-dev libcurl4-openssl-dev zlib1g-dev libdeflate-dev
      - run: uv lock --check
      - run: make venv
#      - run: make pre-commit
      - run: make install
      - run: make test

  # polars-bio supports polars 1.x, 2.0.x and 2.1.x; uv.lock resolves 2.1.
  # Run the suite once more on the newest polars 1.x.
  linux_tests_polars1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Set up Rust
        run: rustup show
      - uses: mozilla-actions/sccache-action@v0.0.9
      - name: Install system dependencies for pysam build
        run: sudo apt-get update && sudo apt-get install -y libbz2-dev liblzma-dev libcurl4-openssl-dev zlib1g-dev libdeflate-dev
      - run: make install
      - name: Install polars 1.x
        run: uv pip install --python .venv "polars>=1.40.0,<2" && uv run --no-sync python -c "import polars; assert polars.__version__.startswith('1.'), polars.__version__; print(polars.__version__)"
      - run: make test-no-sync

  # The `seq` expression namespace is a Polars plugin that crosses the Polars
  # plugin ABI, so run its tests on each end of the supported polars range:
  # 1.40.0, the newest 1.x, 2.0.0 and the newest 2.1.x. One build, then
  # reinstall polars before each run.
  seq_plugin_polars_matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Set up Rust
        run: rustup show
      - uses: mozilla-actions/sccache-action@v0.0.9
      - name: Install system dependencies for pysam build
        run: sudo apt-get update && sudo apt-get install -y libbz2-dev liblzma-dev libcurl4-openssl-dev zlib1g-dev libdeflate-dev
      - run: make install
      - name: Run the seq tests on each supported polars version
        run: |
          for spec in "polars==1.40.0" "polars>=1.40.0,<2" "polars==2.0.0" "polars>=2.1.0,<2.2"; do
            echo "::group::$spec"
            uv pip install --python .venv "$spec"
            uv run --no-sync python -c "import polars; print('polars', polars.__version__)"
            uv run --no-sync pytest tests/test_seq_expressions.py -q
            echo "::endgroup::"
          done

  # Linux arm64 on a native GitHub arm runner. One interpreter only: the wheel
  # is abi3, so arch-specific breakage is interpreter-independent.
  linux_arm64_tests:
    runs-on: ubuntu-24.04-arm
    strategy:
      matrix:
        python-version: [ "3.12" ]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Set up Rust
        run: rustup show
      - uses: mozilla-actions/sccache-action@v0.0.9
      - name: Install system dependencies for pysam build
        run: sudo apt-get update && sudo apt-get install -y libbz2-dev liblzma-dev libcurl4-openssl-dev zlib1g-dev libdeflate-dev
      - run: uv lock --check
      - run: make venv
      - run: make install
      - run: make test

  linux:
    runs-on: ${{ matrix.target == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    strategy:
      matrix:
        # With fat LTO the aarch64 wheel is built by linux-aarch64-lto instead:
        # its link does not fit in the hosted arm runner's 16 GB.
        target: ${{ fromJSON((startsWith(github.ref, 'refs/tags/') || github.event_name == 'schedule' || inputs.lto == true) && '["x86_64"]' || '["x86_64", "aarch64"]') }}
        include:
          - target: x86_64
            cpu_target: "skylake"
          # Generic ARMv8-A: manylinux aarch64 tags cannot express a newer ISA.
          - target: aarch64
            cpu_target: "generic"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          # One abi3 wheel (floor pinned by pyo3's `abi3-py311`). With
          # `--find-interpreter` the manylinux image's 3.14t and PyPy
          # interpreters would add untested version-specific wheels.
          args: ${{ env.BUILD_PROFILE }} --out dist --interpreter python3.11
          sccache: 'true'
          manylinux: auto
        env:
          RUSTFLAGS: "-Dwarnings -Ctarget-cpu=${{ matrix.cpu_target }}"

      - name: Test structure readers from built wheel
        if: runner.os != 'macOS' || matrix.target == 'aarch64' || runner.arch == 'X64'
        shell: bash
        run: |
          python -m pip install pytest
          python -m pip install --force-reinstall dist/*.whl
          mkdir -p wheel-tests/data
          cp tests/test_io_structure.py tests/test_io_foldcomp.py wheel-tests/
          cp -R tests/data/structure wheel-tests/data/
          cd wheel-tests
          python -m pytest test_io_structure.py test_io_foldcomp.py -q
          # The seq namespace is a Polars plugin: check that the stripped,
          # fat-LTO wheel still exports its entry points.
          python -c "import polars as pl, polars_bio; assert pl.DataFrame({'s': ['ACGTN']}).select(pl.col('s').seq.revcomp()).item() == 'NACGT'; print('seq plugin ok')"
      - name: Check distribution size against the PyPI per-file limit
        shell: bash
        run: python .github/scripts/check_wheel_size.py dist
      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: wheels-manylinux-${{ matrix.target }}
          path: dist
  windows:
    runs-on: windows-latest
    strategy:
      matrix:
        target: [x64]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          architecture: ${{ matrix.target }}
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: ${{ env.BUILD_PROFILE }} --out dist --find-interpreter
          sccache: 'true'
        env:
          RUSTFLAGS: "-Dwarnings -Ctarget-cpu=${{ env.TARGET_CPU }}"
      - name: Test structure readers from built wheel
        if: runner.os != 'macOS' || matrix.target == 'aarch64' || runner.arch == 'X64'
        shell: bash
        run: |
          python -m pip install pytest
          python -m pip install --force-reinstall dist/*.whl
          mkdir -p wheel-tests/data
          cp tests/test_io_structure.py tests/test_io_foldcomp.py wheel-tests/
          cp -R tests/data/structure wheel-tests/data/
          cd wheel-tests
          python -m pytest test_io_structure.py test_io_foldcomp.py -q
          # The seq namespace is a Polars plugin: check that the stripped,
          # fat-LTO wheel still exports its entry points.
          python -c "import polars as pl, polars_bio; assert pl.DataFrame({'s': ['ACGTN']}).select(pl.col('s').seq.revcomp()).item() == 'NACGT'; print('seq plugin ok')"
      - name: Check distribution size against the PyPI per-file limit
        shell: bash
        run: python .github/scripts/check_wheel_size.py dist
      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: wheels-win-${{ matrix.target }}
          path: dist

  macos:
    runs-on: ${{ matrix.target == 'aarch64' && 'macos-latest' || 'macos-15-intel' }}
    strategy:
      matrix:
        target: [x86_64, aarch64]
        include:
          - target: x86_64
            apple_cpu_target: "skylake"
          - target: aarch64
            apple_cpu_target: "apple-m1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: ${{ env.BUILD_PROFILE }} --out dist --find-interpreter
          sccache: 'true'
        env:
          RUSTFLAGS: "-Dwarnings -Clink-arg=-undefined -Clink-arg=dynamic_lookup -Ctarget-cpu=${{ matrix.apple_cpu_target }}"
      - name: Test structure readers from built wheel
        if: runner.os != 'macOS' || matrix.target == 'aarch64' || runner.arch == 'X64'
        shell: bash
        run: |
          python -m pip install pytest
          python -m pip install --force-reinstall dist/*.whl
          mkdir -p wheel-tests/data
          cp tests/test_io_structure.py tests/test_io_foldcomp.py wheel-tests/
          cp -R tests/data/structure wheel-tests/data/
          cd wheel-tests
          python -m pytest test_io_structure.py test_io_foldcomp.py -q
          # The seq namespace is a Polars plugin: check that the stripped,
          # fat-LTO wheel still exports its entry points.
          python -c "import polars as pl, polars_bio; assert pl.DataFrame({'s': ['ACGTN']}).select(pl.col('s').seq.revcomp()).item() == 'NACGT'; print('seq plugin ok')"
      - name: Check distribution size against the PyPI per-file limit
        shell: bash
        run: python .github/scripts/check_wheel_size.py dist
      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: wheels-macos-${{ matrix.target }}
          path: dist
  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - name: Check distribution size against the PyPI per-file limit
        shell: bash
        run: python3 .github/scripts/check_wheel_size.py dist
      - name: Upload sdist
        uses: actions/upload-artifact@v6
        with:
          name: wheels-sdist
          path: dist

  # Fat-LTO Linux aarch64 wheel. The final LTO step needs ~34 GiB (12 GiB on
  # macOS; cause unknown), so it is cross-compiled on a self-hosted x86_64
  # host (10 vCPU, 24 GB RAM + 64 GB swap) and tested on a native arm runner.
  # Only for tags, the schedule and manual runs: never for pull requests, so
  # code from forks cannot reach the self-hosted hosts.
  linux-aarch64-lto:
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'schedule' || inputs.lto == true }}
    runs-on: [self-hosted, Linux, X64, openstack-ii, huge-c10m25]
    timeout-minutes: 300
    steps:
      # The build container runs as root and the runner is persistent, so an
      # earlier run can leave root-owned files actions/checkout cannot delete.
      - name: Remove root-owned files from earlier container builds
        run: docker run --rm -v "${{ github.workspace }}:/w" busybox sh -c 'rm -rf /w/target /w/dist'
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Build wheel (cross-compiled, fat LTO)
        uses: PyO3/maturin-action@v1
        with:
          target: aarch64
          args: --profile dist --out dist --interpreter python3.11
          # sccache cannot cache the final cdylib, and on the hosted runner it
          # reported the OOM kill as a bare "exit status 2".
          sccache: 'false'
          # manylinux2014-cross ships GCC 4.8, which libdeflate and ring
          # reject. pyarrow and datafusion only publish manylinux_2_28 aarch64
          # wheels, so this tag costs no users.
          manylinux: 2_28
        env:
          RUSTFLAGS: "-Dwarnings -Ctarget-cpu=generic"
      - name: Check distribution size against the PyPI per-file limit
        run: python .github/scripts/check_wheel_size.py dist
      - uses: actions/upload-artifact@v6
        with:
          name: wheels-manylinux-aarch64
          path: dist
      - name: Hand the workspace back to the runner user
        if: always()
        run: docker run --rm -v "${{ github.workspace }}:/w" busybox chown -R "$(id -u):$(id -g)" /w

  linux-aarch64-lto-test:
    needs: linux-aarch64-lto
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v7
        with:
          name: wheels-manylinux-aarch64
          path: dist
      - name: Test structure readers from the cross-built wheel
        shell: bash
        run: |
          python -m pip install pytest
          python -m pip install dist/*.whl
          mkdir -p wheel-tests/data
          cp tests/test_io_structure.py tests/test_io_foldcomp.py wheel-tests/
          cp -R tests/data/structure wheel-tests/data/
          cd wheel-tests
          python -c "import polars_bio, platform; print(polars_bio.__file__, platform.machine())"
          python -m pytest test_io_structure.py test_io_foldcomp.py -q

  release:
    name: Release
    if: "startsWith(github.ref, 'refs/tags/')"
    needs: [rust_tests, linux_arm64_tests, linux_tests_polars1, linux, linux-aarch64-lto-test, windows, macos, sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # Use to sign the release artifacts
      id-token: write
      # Used to upload release artifacts
      contents: write
      # Used to generate artifact attestation
      attestations: write
    steps:
    - uses: actions/download-artifact@v7
    - name: Generate artifact attestation
      uses: actions/attest-build-provenance@v3
      with:
        subject-path: 'wheels-*/*'
    - name: Publish to PyPI
      uses: PyO3/maturin-action@v1
      with:
        command: upload
        args: --non-interactive --skip-existing wheels-*/*
