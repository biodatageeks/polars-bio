[package]
name = "polars_bio"
version = "0.37.0"
edition = "2021"
license = "Apache-2.0"

[features]
# Global allocator selection (issue #402). Exactly one is compiled in.
#
# `mimalloc` is ON BY DEFAULT: it restores the allocator polars-bio <=0.31 got for
# free via datafusion-python's default features, which 0.32 lost when it set
# `default-features = false` on datafusion-python — regressing allocation-heavy
# BAM/VCF reads by ~15-45% at one thread. mimalloc is pinned to v2 (v3 segfaults at
# import on macOS arm64).
#
# To use jemalloc instead (faster on some interval-operation workloads):
#   maturin build --release --no-default-features --features jemalloc
# jemalloc is unsupported on Windows/MSVC; there the build falls back to mimalloc.
default = ["mimalloc"]
mimalloc = ["dep:mimalloc"]
jemalloc = ["dep:tikv-jemallocator"]

[lib]
name = "polars_bio"
crate-type= ["cdylib"]




[dependencies]
datafusion-python = { version = "55.0.0", default-features = false }
# Global allocators, selected via the [features] above (mimalloc default-on).
# Both optional so exactly one is linked; enabling neither keeps the system allocator.
mimalloc = { version = "0.1", default-features = false, features = ["v2"], optional = true }
tikv-jemallocator = { version = "0.6", optional = true }
pyo3 = { version = "0.29.3", features = ["extension-module", "abi3-py311"] }
pyo3-log = "0.13.5"


# Keep DataFusion at 55.2.0 to match the exact pins in bio-formats and bio-functions.
datafusion = { version = "55.2.0", default-features = false, features = ["nested_expressions", "crypto_expressions", "datetime_expressions", "encoding_expressions", "regex_expressions", "string_expressions", "unicode_expressions", "parquet", "recursive_protection", "sql"] }
arrow = "59.3.2"
arrow-schema = "59.3.2"
arrow-array = { version = "59.3.2", features = ["ffi"] }
tokio = {version = "1.42.0", features = ["full", "tracing"]}
log = "0.4.22"
tracing = { version = "0.1.41", features = ["log"] }
futures-util = "0.3.31"

# Keep every formats crate on the same release to avoid duplicate core types.
# bio-functions v0.25.0 is built on bio-formats v1.16.0, so bump them together.
# Structure and Foldcomp use pure-Rust codecs; the bundled Foldcomp MIT notices
# still apply to its format and tables.
datafusion-bio-format-vcf = { git = "https://github.com/biodatageeks/datafusion-bio-formats.git", tag = "v1.16.0" }
datafusion-bio-format-core = { git = "https://github.com/biodatageeks/datafusion-bio-formats.git", tag = "v1.16.0" }
datafusion-bio-format-gff = { git = "https://github.com/biodatageeks/datafusion-bio-formats.git", tag = "v1.16.0" }
datafusion-bio-format-fastq = { git = "https://github.com/biodatageeks/datafusion-bio-formats.git", tag = "v1.16.0" }
datafusion-bio-format-bam = { git = "https://github.com/biodatageeks/datafusion-bio-formats.git", tag = "v1.16.0" }
datafusion-bio-format-cram = { git = "https://github.com/biodatageeks/datafusion-bio-formats.git", tag = "v1.16.0" }
datafusion-bio-format-bed = { git = "https://github.com/biodatageeks/datafusion-bio-formats.git", tag = "v1.16.0" }
datafusion-bio-format-fasta = { git = "https://github.com/biodatageeks/datafusion-bio-formats.git", tag = "v1.16.0" }
datafusion-bio-format-pairs = { git = "https://github.com/biodatageeks/datafusion-bio-formats.git", tag = "v1.16.0" }
datafusion-bio-format-gtf = { git = "https://github.com/biodatageeks/datafusion-bio-formats.git", tag = "v1.16.0" }
datafusion-bio-format-bbi = { git = "https://github.com/biodatageeks/datafusion-bio-formats.git", tag = "v1.16.0" }
datafusion-bio-format-bgen = { git = "https://github.com/biodatageeks/datafusion-bio-formats.git", tag = "v1.16.0" }
datafusion-bio-format-pgen = { git = "https://github.com/biodatageeks/datafusion-bio-formats.git", tag = "v1.16.0" }
datafusion-bio-format-cooler = { git = "https://github.com/biodatageeks/datafusion-bio-formats.git", tag = "v1.16.0" }
datafusion-bio-format-msa = { git = "https://github.com/biodatageeks/datafusion-bio-formats.git", tag = "v1.16.0" }
datafusion-bio-format-structure = { git = "https://github.com/biodatageeks/datafusion-bio-formats.git", tag = "v1.16.0" }
datafusion-bio-format-foldcomp = { git = "https://github.com/biodatageeks/datafusion-bio-formats.git", tag = "v1.16.0" }

datafusion-bio-function-ranges = { git = "https://github.com/biodatageeks/datafusion-bio-functions.git", tag = "v0.25.0" }
datafusion-bio-function-pileup = { git = "https://github.com/biodatageeks/datafusion-bio-functions.git", tag = "v0.25.0", default-features = false }
datafusion-bio-function-fastqc = { git = "https://github.com/biodatageeks/datafusion-bio-functions.git", tag = "v0.25.0" }

async-trait = "0.1.86"
futures = "0.3.31"
rand = "0.8.5"
serde_json = "1.0"

